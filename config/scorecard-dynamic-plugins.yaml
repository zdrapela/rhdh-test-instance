- package: 'oci://ghcr.io/redhat-developer/rhdh-plugin-export-overlays/red-hat-developer-hub-backstage-plugin-scorecard-backend:bs_1.49.4__2.7.8!red-hat-developer-hub-backstage-plugin-scorecard-backend'
  disabled: false
- package: 'oci://ghcr.io/redhat-developer/rhdh-plugin-export-overlays/red-hat-developer-hub-backstage-plugin-scorecard-backend-module-github:bs_1.49.4__2.7.8!red-hat-developer-hub-backstage-plugin-scorecard-backend-module-github'
  disabled: false
- package: 'oci://ghcr.io/redhat-developer/rhdh-plugin-export-overlays/red-hat-developer-hub-backstage-plugin-scorecard:bs_1.49.4__2.7.8!red-hat-developer-hub-backstage-plugin-scorecard'
  disabled: false
  pluginConfig:
    dynamicPlugins:
      frontend:
        red-hat-developer-hub.backstage-plugin-scorecard:
          translationResources:
            - importName: scorecardTranslations
              ref: scorecardTranslationRef
          dynamicRoutes:
            - path: /scorecard/aggregations/:aggregationId/metrics/:metricId
              importName: ScorecardPage
          entityTabs:
            - path: /scorecard
              title: Scorecard
              mountPoint: entity.page.scorecard
          mountPoints:
            - mountPoint: entity.page.scorecard/cards
              importName: EntityScorecardContent
              config:
                layout:
                  gridColumn: "1 / -1"
              if:
                allOf:
                  - isKind: component
