app:
  baseUrl: '${RHDH_BASE_URL}'

backend:
  baseUrl: '${RHDH_BASE_URL}'
  cors:
    origin: '${RHDH_BASE_URL}'
  actions:
    pluginSources:
      - software-catalog-mcp-extras
      - techdocs-mcp-extras
      - scaffolder-mcp-extras
  auth:
    externalAccess:
      - type: legacy
        options:
          secret: '${BACKEND_SECRET}'
          subject: legacy-default-config
      - type: static
        options:
          token: '${MCP_TOKEN}'
          subject: mcp-clients
    keys:
      - secret: '${BACKEND_SECRET}'
  csp:
    connect-src:
      - "'self'"
      - 'http:'
      - 'https:'
    img-src:
      - "'self'"
      - 'data:'

i18n:
  locales:
    - en
    - de
    - es
    - fr
    - it
    - ja
  defaultLocale: en

permission:
  enabled: true
  rbac:
    pluginsWithPermission:
      - catalog
      - permission
      - intelligent-assistant
    admin:
      superUsers:
        - name: user:default/test1
    defaultPolicy: allow

auth:
  environment: production
  session:
    secret: '${SESSION_SECRET}'

signInPage: oidc

kubernetes:
  serviceLocatorMethod:
    type: multiTenant
  clusterLocatorMethods:
    - type: config
      clusters:
        - url: https://kubernetes.default.svc
          name: local-cluster
          authProvider: serviceAccount
          skipTLSVerify: true
          skipMetricsLookup: true

catalog:
  import:
    entityFilename: catalog-info.yaml
    pullRequestBranchName: backstage-integration
  rules:
    - allow: [API, Component, User, Group, Location, Resource, System, Template]
  locations:
    - type: url
      target: https://github.com/redhat-developer/rhdh/blob/main/catalog-entities/all.yaml
    - type: url
      target: https://github.com/redhat-developer/red-hat-developer-hub-software-templates/blob/main/templates.yaml
    - type: file
      target: ./catalog-entities/users.yaml
    - type: file
      target: ./catalog-entities/components.yaml
    - type: file
      target: ./catalog-entities/operators.yaml
    - type: file
      target: ./catalog-entities/resources.yaml
    - type: file
      target: ./catalog-entities/plugins.yaml
    - type: file
      target: ./catalog-entities/topology-test.yaml

mcpActions:
  namespacedToolNames: false
