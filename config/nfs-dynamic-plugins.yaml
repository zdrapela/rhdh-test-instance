# RHDH 2.1 already bundles plugin-home and the RHDH theme in the app.
# All other packages resolve through the bundled catalog's defaults.
- package: ref://red-hat-developer-hub-backstage-plugin-app-defaults
  enabled: true
- package: ref://red-hat-developer-hub-backstage-plugin-app-auth
  enabled: true
- package: ref://red-hat-developer-hub-backstage-plugin-app-integrations
  enabled: true
- package: ref://red-hat-developer-hub-backstage-plugin-global-header
  enabled: true
- package: ref://red-hat-developer-hub-backstage-plugin-quickstart
  enabled: true
- package: ref://red-hat-developer-hub-backstage-plugin-homepage
  enabled: true
- package: ref://red-hat-developer-hub-backstage-plugin-homepage-backend
  enabled: true
- package: ref://red-hat-developer-hub-backstage-plugin-adoption-insights
  enabled: true
- package: ref://red-hat-developer-hub-backstage-plugin-adoption-insights-backend
  enabled: true
- package: ref://red-hat-developer-hub-backstage-plugin-analytics-module-adoption-insights
  enabled: true
- package: ref://red-hat-developer-hub-backstage-plugin-extensions
  enabled: true
- package: ref://red-hat-developer-hub-backstage-plugin-extensions-backend
  enabled: true
- package: ref://red-hat-developer-hub-backstage-plugin-catalog-backend-module-extensions
  enabled: true
- package: ref://red-hat-developer-hub-backstage-plugin-bulk-import
  enabled: true
- package: ref://red-hat-developer-hub-backstage-plugin-bulk-import-backend
  enabled: true
- package: ref://backstage-plugin-techdocs
  enabled: true
- package: ref://backstage-plugin-techdocs-backend
  enabled: true
- package: ref://backstage-plugin-techdocs-module-addons-contrib
  enabled: false
- package: ref://backstage-plugin-kubernetes
  enabled: true
- package: ref://backstage-plugin-kubernetes-backend
  enabled: true
  pluginConfig:
    kubernetes:
      serviceLocatorMethod:
        type: multiTenant
      clusterLocatorMethods:
        - type: config
          clusters:
            - url: https://kubernetes.default.svc
              name: local-cluster
              authProvider: serviceAccount
              skipTLSVerify: true
              skipMetricsLookup: true
- package: ref://backstage-community-plugin-topology
  enabled: true
