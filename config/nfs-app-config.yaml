app:
  packages: all
  extensions:
    - api:app/app-language:
        config:
          availableLanguages: ["en", "de", "fr", "it", "es", "ja"]
          defaultLanguage: "en"

    - api:home/visits: true
    - app-root-element:home/visit-listener: true
    - home-page-widget:homepage/quickaccess-card: false
    - home-page-widget:scorecard/scorecard-aggregated-card: false
    - home-page-widget:homepage/search-bar: false
    - home-page-widget:homepage/catalog-starred-entities-card: false

    # Search is provided by the global header; avoid the legacy sidebar modal.
    - sidebar-element:app/search: false
    - sidebar-divider:app/search: false

    # Keep the RHDH homepage at / instead of the bundled Backstage home page.
    - page:home: false
    - page:homepage:
        config:
          path: /

  quickstart:
    - title: Set up authentication
      icon: Admin
      description: Set up secure login credentials to protect your account from unauthorized access.
      cta:
        text: Learn more
        link: https://docs.redhat.com/en/documentation/red_hat_developer_hub/latest/html/authentication_in_red_hat_developer_hub/
    - title: Configure RBAC
      icon: Rbac
      description: Assign roles and permissions to control who can view, create, or edit resources, ensuring secure and efficient collaboration.
      cta:
        text: Manage access
        link: /rbac
    - title: Configure Git
      icon: Git
      description: Connect your Git providers, such as GitHub to manage code, automate workflows, and integrate with platform features.
      cta:
        text: Learn more
        link: https://docs.redhat.com/en/documentation/red_hat_developer_hub/latest/html/integrating_red_hat_developer_hub_with_github/
    - title: Manage plugins
      icon: Plugins
      description: Browse and install extensions to add features, connect with external tools, and customize your experience.
      cta:
        text: Explore plugins
        link: /extensions
    - title: Import application
      roles: ["developer"]
      icon: Import
      description: Import your existing code and services into the catalog to organize and access them through your developer portal.
      cta:
        text: Import
        link: /bulk-import
    - title: Learn about the Catalog
      roles: ["developer"]
      icon: Catalog
      description: Discover all software components, services, and APIs, and view their owners and documentation.
      cta:
        text: View Catalog
        link: /catalog
    - title: Explore Self-service templates
      roles: ["developer"]
      icon: SelfService
      description: Use our self-service templates to quickly set up new projects, services, or documentation.
      cta:
        text: Explore templates
        link: /create
    - title: Find all Learning Paths
      roles: ["developer"]
      icon: Learning
      description: Integrate tailored e-learning into your workflows with Learning Paths to accelerate onboarding, close skill gaps, and promote best practices.
      cta:
        text: View Learning Paths
        link: /learning-paths
    - title: Set up Intelligent Assistant
      icon: Lightspeed
      description: Connect Intelligent Assistant to a supported large language model (LLM) and configure permissions to provide AI-powered assistance to your developers.
      cta:
        text: Learn more
        link: https://docs.redhat.com/en/documentation/red_hat_developer_hub/latest/html/interacting_with_red_hat_developer_lightspeed_for_red_hat_developer_hub/
    - title: Get started with Intelligent Assistant
      icon: Lightspeed
      roles: ["developer"]
      description: Troubleshoot issues, generate code, and learn about platform resources using AI-powered chat.
      cta:
        text: Learn more
        link: https://docs.redhat.com/en/documentation/red_hat_developer_hub/latest/html/interacting_with_red_hat_developer_lightspeed_for_red_hat_developer_hub/

catalog:
  defaultOwnerFilter: all

intelligent-assistant:
  servicePort: 8080
  notebooks:
    enabled: true
    queryDefaults:
      model: gpt-4o-mini
      provider_id: openai
  mcpServers:
    - name: mcp-integration-tools
      auth: dcr
    - name: mcp-token-required-tools
    - name: mcp-observability-tools
      token: ${MCP_TOKEN}
  prompts:
    - title: Getting Started with Red Hat Developer Hub
      message: >-
        Can you guide me through the first steps to start using Developer Hub as
        a developer, like exploring the Software Catalog and adding my service?
