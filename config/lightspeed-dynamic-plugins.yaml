# Intelligent Assistant, using catalog defaults with the existing MCP settings.
- package: ref://red-hat-developer-hub-backstage-plugin-intelligent-assistant
  enabled: true
- package: ref://red-hat-developer-hub-backstage-plugin-intelligent-assistant-backend
  enabled: true
  pluginConfig:
    intelligent-assistant:
      mcpServers:
        - name: mcp-integration-tools
          auth: dcr
        - name: mcp-token-required-tools
        - name: mcp-observability-tools
          token: ${MCP_TOKEN}
      servicePort: 8080
