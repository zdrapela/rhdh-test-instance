# RHDH 2.1 chart values (no upstream.backstage subchart).
# Dynamic plugins are supplied at install time by helm/deploy.sh from the
# cluster ConfigMap (or config/dynamic-plugins.yaml).
# extraAppConfig is built dynamically by helm/deploy.sh based on enabled components.

podLabels:
  backstage.io/kubernetes-id: developer-hub

# Single-replica + ephemeral dynamic-plugins PVC: rolling updates deadlock
# (new pod can't schedule while old pod holds CPU/volume).
# Note: helm --reuse-values can leave a stale rollingUpdate block and reject
# Recreate; prefer a fresh upgrade or clear strategy.rollingUpdate explicitly.
strategy:
  type: Recreate

extraEnvFrom:
  - secretRef:
      name: rhdh-secrets

auth:
  backend:
    existingSecretRef:
      name: rhdh-secrets
      key: BACKEND_SECRET

extraEnv:
  - name: NODE_TLS_REJECT_UNAUTHORIZED
    value: '0'
  - name: SEGMENT_TEST_MODE
    value: 'true'
  - name: LOG_LEVEL
    value: debug

# RBAC policy + catalog entity ConfigMaps (created by setup-resources.sh)
extraVolumeMounts:
  - name: rbac-policy
    mountPath: /opt/app-root/src/rbac
  - name: catalog-entities
    mountPath: /opt/app-root/src/catalog-entities

extraVolumes:
  - name: rbac-policy
    configMap:
      defaultMode: 420
      name: rbac-policy
  - name: catalog-entities
    projected:
      sources:
        - configMap:
            name: plugins-config-map
        - configMap:
            name: operators-config-map
            optional: true
        - configMap:
            name: components-config-map
            optional: true
        - configMap:
            name: resources-config-map
            optional: true

# Keep the existing ephemeral plugin storage allocation.
dynamicPlugins:
  volume:
    type: ephemeral
    ephemeral:
      accessModes:
        - ReadWriteOnce
      resources:
        requests:
          storage: 5Gi
