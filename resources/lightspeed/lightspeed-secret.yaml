apiVersion: v1
kind: Secret
metadata:
  name: lightspeed-secret
type: Opaque
stringData:
  # At least one provider must be enabled. Set the corresponding
  # ENABLE_* to "true" and provide the required credentials.
  # Values can be set in .env or patched after deployment:
  #   oc patch secret lightspeed-secret -n <ns> --type=merge \
  #     -p '{"stringData":{"ENABLE_OPENAI":"true","OPENAI_API_KEY":"sk-..."}}'

  # --- OpenAI ---
  ENABLE_OPENAI: "${ENABLE_OPENAI}"
  OPENAI_API_KEY: "${OPENAI_API_KEY}"

  # --- vLLM ---
  ENABLE_VLLM: "${ENABLE_VLLM}"
  VLLM_URL: "${VLLM_URL}"
  VLLM_API_KEY: "${VLLM_API_KEY}"
  VLLM_MAX_TOKENS: "${VLLM_MAX_TOKENS}"
  VLLM_TLS_VERIFY: "${VLLM_TLS_VERIFY}"

  # --- Ollama ---
  ENABLE_OLLAMA: "${ENABLE_OLLAMA}"
  OLLAMA_URL: "${OLLAMA_URL}"

  # --- Vertex AI ---
  ENABLE_VERTEX_AI: "${ENABLE_VERTEX_AI}"
  VERTEX_AI_PROJECT: "${VERTEX_AI_PROJECT}"
  VERTEX_AI_LOCATION: "${VERTEX_AI_LOCATION}"
  GOOGLE_APPLICATION_CREDENTIALS: "${GOOGLE_APPLICATION_CREDENTIALS}"

  # --- Validation ---
  ENABLE_VALIDATION: "${ENABLE_VALIDATION}"
  VALIDATION_PROVIDER: "${VALIDATION_PROVIDER}"
  VALIDATION_MODEL_NAME: "${VALIDATION_MODEL_NAME}"
  LLAMA_STACK_LOGGING: "${LLAMA_STACK_LOGGING}"
