# OIDC auth backend module — required on RHDH 2.x NFS overlays when the
# catalog-index OIDC provider is not loaded. On older 1.10.z images this can
# duplicate a built-in provider; keep enabled for 2.1 test day.
- package: "oci://ghcr.io/redhat-developer/rhdh-plugin-export-overlays/backstage-plugin-auth-backend-module-oidc-provider:bs_1.54.9__0.4.20"
  disabled: false
- package: "oci://ghcr.io/redhat-developer/rhdh-plugin-export-overlays/backstage-community-plugin-catalog-backend-module-keycloak:bs_1.54.9__3.23.1"
  disabled: false
  pluginConfig:
    catalog:
      providers:
        keycloakOrg:
          default:
            baseUrl: "${KEYCLOAK_BASE_URL}"
            loginRealm: "${KEYCLOAK_LOGIN_REALM}"
            realm: "${KEYCLOAK_REALM}"
            clientId: "${KEYCLOAK_CLIENT_ID}"
            clientSecret: "${KEYCLOAK_CLIENT_SECRET}"
            schedule:
              frequency: { minutes: 20 }
              initialDelay: { seconds: 15 }
              timeout: { minutes: 5 }
    auth:
      environment: production
      providers:
        oidc:
          production:
            metadataUrl: "${KEYCLOAK_METADATA_URL}"
            clientId: "${KEYCLOAK_CLIENT_ID}"
            clientSecret: "${KEYCLOAK_CLIENT_SECRET}"
            prompt: auto
            callbackUrl: "${RHDH_BASE_URL}/api/auth/oidc/handler/frame"
            signIn:
              resolvers:
                - resolver: emailLocalPartMatchingUserEntityName
        guest:
          dangerouslyAllowOutsideDevelopment: false
    signInPage: oidc
